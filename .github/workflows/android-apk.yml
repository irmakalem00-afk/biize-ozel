name: Android APK Olustur

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: ZIP dosyasini ac
        run: |
          unzip -o Bize-Ozel-APK-Hazir.zip -d apk-projesi
          ls -la apk-projesi/bize-ozel-main

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Paketleri kur
        working-directory: apk-projesi/bize-ozel-main
        run: npm install

      - name: Android projesini hazirla
        working-directory: apk-projesi/bize-ozel-main
        run: npm run android:prepare

      - name: APK olustur
        working-directory: apk-projesi/bize-ozel-main/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasini hazirla
        run: |
          mkdir -p APK-CIKTISI
          cp apk-projesi/bize-ozel-main/android/app/build/outputs/apk/debug/app-debug.apk APK-CIKTISI/Bize-Ozel.apk

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: Bize-Ozel-APK
          path: APK-CIKTISI/Bize-Ozel.apk
